<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact — Sabbir Ahmed</title>
  <meta id="meta-description" name="description" content="Get in touch with Sabbir Ahmed.">

  <script>
    (function () {
      var stored = localStorage.getItem('theme');
      var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.setAttribute('data-theme', stored || (prefersDark ? 'dark' : 'light'));
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="top-controls">
    <button id="menu-toggle" class="icon-btn" aria-label="Toggle menu">
      <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <button id="theme-toggle" class="icon-btn" aria-label="Toggle dark mode">
      <svg class="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z"/></svg>
    </button>
  </div>

  <div class="layout">
    <aside class="sidebar" id="sidebar"></aside>

    <main>
      <section id="contact">
        <div class="section-head"><h2>Contact</h2></div>
        <form id="contact-form" class="contact-form" action="https://formspree.io/f/mvgoydvj" method="POST">
          <div>
            <label for="name">Name</label>
            <input type="text" id="name" name="name" placeholder="Your name" required>
          </div>
          <div>
            <label for="email">Email</label>
            <input type="email" id="email" name="_replyto" placeholder="Your email" required>
          </div>
          <div>
            <label for="message">Message</label>
            <textarea id="message" name="message" rows="5" placeholder="Your message" required></textarea>
          </div>
          <button type="submit" id="submit-button">Send Message</button>
        </form>
        <div id="form-message" class="hidden">
          <p>Thanks for reaching out — I'll get back to you soon.</p>
        </div>
      </section>

      <footer>
        &copy; <span id="year"></span> Sabbir Ahmed. Built with plain HTML, CSS &amp; JS.
      </footer>
    </main>
  </div>

  <script src="content.js"></script>
  <script src="script.js"></script>
</body>
</html>
