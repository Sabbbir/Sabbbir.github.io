<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CV — Sabbir Ahmed</title>
  <meta id="meta-description" name="description" content="Education, teaching experience, awards, and skills of Sabbir Ahmed.">

  <script>
    (function () {
      var stored = localStorage.getItem('theme');
      var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.setAttribute('data-theme', stored || (prefersDark ? 'dark' : 'light'));
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="styles.css">

  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
</head>
<body>

  <div class="top-controls">
    <button id="menu-toggle" class="icon-btn" aria-label="Toggle menu">
      <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <button id="theme-toggle" class="icon-btn" aria-label="Toggle dark mode">
      <svg class="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z"/></svg>
    </button>
  </div>

  <button id="back-to-top" class="icon-btn" aria-label="Back to top">
    <svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
  </button>

  <div class="layout">
    <aside class="sidebar" id="sidebar"></aside>

    <main>
      <div class="cv-jump">
        <a href="#education">Education</a>
        <a href="#teaching">Teaching</a>
        <a href="#awards">Awards</a>
        <a href="#skills">Skills</a>
      </div>

      <section id="education">
        <div class="section-head"><h2>Education</h2></div>
        <div id="education-list"></div>
      </section>

      <section id="teaching">
        <div class="section-head"><h2>Teaching & Professional Experience</h2></div>
        <div id="teaching-list"></div>
      </section>

      <section id="awards">
        <div class="section-head"><h2>Awards & Service</h2></div>
        <div id="awards-list"></div>
      </section>

      <section id="skills">
        <div class="section-head"><h2>Skills</h2></div>
        <div id="skills-list"></div>
        <div class="skill-group">
          <h3>Languages</h3>
          <div id="languages-list" class="pill-row"></div>
        </div>
      </section>

      <footer>
        &copy; <span id="year"></span> Sabbir Ahmed. Built with plain HTML, CSS &amp; JS.
      </footer>
    </main>
  </div>

  <script src="content.js"></script>
  <script src="script.js"></script>
</body>
</html>
