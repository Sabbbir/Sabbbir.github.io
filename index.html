<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sabbir Ahmed</title>
  <meta id="meta-description" name="description" content="Sabbir Ahmed — Machine Learning Researcher.">
  <meta property="og:title" content="Sabbir Ahmed">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://sabbbir.github.io/">

  <!-- Inline theme script: runs before CSS paints, so there's no flash of the wrong theme -->
  <script>
    (function () {
      var stored = localStorage.getItem('theme');
      var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.setAttribute('data-theme', stored || (prefersDark ? 'dark' : 'light'));
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Fixed controls -->
  <div class="top-controls">
    <button id="menu-toggle" class="icon-btn" aria-label="Toggle menu">
      <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <button id="theme-toggle" class="icon-btn" aria-label="Toggle dark mode">
      <svg class="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z"/></svg>
    </button>
  </div>

  <button id="back-to-top" class="icon-btn" aria-label="Back to top">
    <svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
  </button>

  <div class="layout">
    <!-- ============ SIDEBAR ============ -->
    <aside class="sidebar" id="sidebar">
      <div class="avatar" id="sidebar-initials"></div>

      <div class="sidebar-id">
        <h1 id="sidebar-name"></h1>
        <p class="title" id="sidebar-title"></p>
        <p class="location" id="sidebar-location"></p>
      </div>

      <nav class="sidebar-links" id="sidebar-links"></nav>

      <nav class="sidebar-nav">
        <a class="nav-link" href="#about">About</a>
        <a class="nav-link" href="#research">Research</a>
        <a class="nav-link" href="#projects">Projects</a>
        <a class="nav-link" href="#teaching">Teaching</a>
        <a class="nav-link" href="#education">Education</a>
        <a class="nav-link" href="#awards">Awards</a>
        <a class="nav-link" href="#skills">Skills</a>
        <a class="nav-link" href="#contact">Contact</a>
      </nav>
    </aside>

    <!-- ============ MAIN ============ -->
    <main>
      <section id="about" class="hero">
        <p class="hero-tagline" id="hero-tagline"></p>
        <div id="bio"></div>
      </section>

      <section id="research">
        <div class="section-head"><h2>Research Experience</h2></div>
        <div id="research-list"></div>
      </section>

      <section id="projects">
        <div class="section-head"><h2>Projects</h2></div>
        <div class="projects-grid" id="projects-grid"></div>
      </section>

      <section id="teaching">
        <div class="section-head"><h2>Teaching & Professional Experience</h2></div>
        <div id="teaching-list"></div>
      </section>

      <section id="education">
        <div class="section-head"><h2>Education</h2></div>
        <div id="education-list"></div>
      </section>

      <section id="awards">
        <div class="section-head"><h2>Awards & Service</h2></div>
        <div id="awards-list"></div>
      </section>

      <section id="skills">
        <div class="section-head"><h2>Skills</h2></div>
        <div id="skills-list"></div>
        <div class="skill-group">
          <h3>Languages</h3>
          <div id="languages-list" class="pill-row"></div>
        </div>
      </section>

      <section id="contact">
        <div class="section-head"><h2>Contact</h2></div>
        <form id="contact-form" class="contact-form" action="https://formspree.io/f/mvgoydvj" method="POST">
          <div>
            <label for="name">Name</label>
            <input type="text" id="name" name="name" placeholder="Your name" required>
          </div>
          <div>
            <label for="email">Email</label>
            <input type="email" id="email" name="_replyto" placeholder="Your email" required>
          </div>
          <div>
            <label for="message">Message</label>
            <textarea id="message" name="message" rows="5" placeholder="Your message" required></textarea>
          </div>
          <button type="submit" id="submit-button">Send Message</button>
        </form>
        <div id="form-message" class="hidden">
          <p>Thanks for reaching out — I'll get back to you soon.</p>
        </div>
      </section>

      <footer>
        &copy; <span id="year"></span> Sabbir Ahmed. Built with plain HTML, CSS &amp; JS.
      </footer>
    </main>
  </div>

  <script src="content.js"></script>
  <script src="script.js"></script>
  <script>document.getElementById('year').textContent = new Date().getFullYear();</script>
</body>
</html>
